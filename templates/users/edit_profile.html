{% extends "base.html" %}
{% block title %}Profil Düzenle{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Profilini Düzenle</h3>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Profil Resmi</label>
                    {{ form.avatar }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Açıklama</label>
                    {{ form.description }}
                </div>
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a href="{% url 'movies:user_profile' request.user.id %}" class="btn btn-secondary ms-2">İptal</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
