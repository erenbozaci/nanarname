{% extends "base.html" %}
{% block title %}Giriş Yap{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width:500px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white"><h4 class="mb-0">Giriş Yap</h4></div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary w-100" type="submit">Giriş</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
